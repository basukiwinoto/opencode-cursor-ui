name: CI & Publish

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute next version from the latest tag
        id: ver
        run: |
          TAG_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          PKG_VER=$(node -p "require('./package.json').version")
          BASE=$(printf '%s\n%s\n' "$TAG_VER" "$PKG_VER" | sort -V | tail -1)
          NEXT=$(node -e "const s='$BASE'.split('.'); s[2]=(+s[2]||0)+1; console.log(s.join('.'))")
          echo "next=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Publishing v$NEXT (base: $BASE)"
      - name: Stamp version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version
      - run: npm run build
      - name: Publish to VS Code Marketplace
        run: npx vsce publish -p "${{ secrets.VSCE_PAT }}" --no-dependencies
      - name: Publish to Open VSX (Cursor, VSCodium)
        if: env.OPEN_VSX_TOKEN != ''
        run: npx ovsx publish -p "$OPEN_VSX_TOKEN"
      - name: Tag release
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT"
          git push origin "$NEXT"
